<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
  />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N"
    crossorigin="anonymous"
  />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
<div class="container offset#">
    <div class="row">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h1>CURD Comments</h1>
                </div>
                <div class="card-body">
                    <form action="" id="commentForm">
                        <div class="form-group">
                            <label for="name">Name*</label>
                            <input type="text" id="name" class="form-control" placeholder="Enter The Name">
                        </div>
                          <div class="form-group">
                            <label for="name">Email*</label>
                            <input type="text" id="email" class="form-control" placeholder="Enter The Email">
                        </div>
                          <div class="form-group">
                            <label for="name">Body*</label>
                            <textarea type="text" id="body" class="form-control" placeholder="Enter The COntent" rows="4"  ></textarea>
                        </div>
                        <div class="card-footer">
                             <button class="btn btn-primary text-white btn-block" id="addBtn"  >Add Post</button>
                             <button class="btn btn-info text-white btn-block d-none" id="UpdateBtn" type="button">Update Post</button>
                        </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <div class="row" id="commentContainer"></div>
    </div>
</div> 
<div class="spinner d-none" id="spinner">
    <div class="spinner-border text-danger" role="status">
        
    </div>

</div> 


<script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="assets/app.js"></script>
</body>
</html>
